name: Deploy HR Frontend

on:
  push:
    branches:
      - integration
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hr-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time salary summary fix
        if: github.ref_name == 'integration'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/finance/EmployeeSalaryTable.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''      case "salarySummary":
        return (
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] leading-5">
            <span className="font-black text-slate-900">Gross: {money(row.grossPay, row.currency)}</span>
            <span className="text-slate-300">.</span>
            <span className="font-black text-rose-600">Deduct: {money(row.deductionTotal ?? row.totalDeductions, row.currency)}</span>
            <span className="text-slate-300">.</span>
            <span className="font-black text-emerald-700">Net: {money(row.netPay, row.currency)}</span>
          </div>
        );'''

          new = '''      case "salarySummary": {
        const isNetMode = String(row.salaryInputMode || "").toLowerCase() === "net" && Number(row.targetNetSalary || 0) > 0;
        const configuredSalary = isNetMode ? Number(row.targetNetSalary || 0) : Number(row.baseSalary || 0);
        const configuredLabel = isNetMode ? "Target Net" : "Base";
        return (
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] leading-5">
            <span className="font-black text-slate-900">{configuredLabel}: {money(configuredSalary, row.currency)}</span>
            <span className="text-slate-300">.</span>
            <span className="font-black text-rose-600">Deduct: {money(row.deductionTotal ?? row.totalDeductions, row.currency)}</span>
            <span className="text-slate-300">.</span>
            <span className="font-black text-emerald-700">Payable: {money(row.netPay, row.currency)}</span>
          </div>
        );
      }'''

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif 'const configuredLabel = isNetMode ? "Target Net" : "Base";' not in text:
              raise SystemExit("Salary summary block did not match the expected old or new form")
          PY

          if ! git diff --quiet -- src/components/finance/EmployeeSalaryTable.tsx; then
            git config user.name "Blih automation"
            git config user.email "actions@github.com"
            git add src/components/finance/EmployeeSalaryTable.tsx
            git commit -m "fix: show configured salary in summary"
            git push origin HEAD:integration
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Trigger VPS deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="${{ secrets.HOSTINGER_FRONTEND_DEPLOY_PATH }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "HOSTINGER_FRONTEND_DEPLOY_PATH is empty."
              exit 1
            fi

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Frontend deployment directory does not exist:"
              echo "$DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f "deploy.sh" ]; then
              echo "deploy.sh was not found in:"
              echo "$DEPLOY_PATH"
              exit 1
            fi

            chmod +x deploy.sh

            ./deploy.sh "$BRANCH"
