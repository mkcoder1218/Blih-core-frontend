name: Deploy HR Frontend

on:
  push:
    branches:
      - integration
      - "feat/**"

  pull_request:
    branches:
      - integration

  workflow_dispatch:

concurrency:
  group: hr-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'integration'
    environment: production

    steps:
      - name: Trigger VPS deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="${{ secrets.HOSTINGER_FRONTEND_DEPLOY_PATH }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "HOSTINGER_FRONTEND_DEPLOY_PATH is empty."
              exit 1
            fi

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Frontend deployment directory does not exist:"
              echo "$DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f "deploy.sh" ]; then
              echo "deploy.sh was not found in:"
              echo "$DEPLOY_PATH"
              exit 1
            fi

            chmod +x deploy.sh

            ./deploy.sh "$BRANCH"
