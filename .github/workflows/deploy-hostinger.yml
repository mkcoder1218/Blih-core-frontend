name: Deploy HR Frontend

on:
  push:
    branches:
      - master
      - integration

concurrency:
  group: deploy-hr-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy frontend to VPS
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="${{ secrets.FRONTEND_DEPLOY_PATH }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "FRONTEND_DEPLOY_PATH secret is empty."
              exit 1
            fi

            echo "Deploying frontend branch: $BRANCH"
            echo "Frontend deployment path: $DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then
              echo "No Git repository found at $DEPLOY_PATH"
              exit 1
            fi

            if [ ! -f ".env.production" ]; then
              echo ".env.production is missing in $DEPLOY_PATH"
              exit 1
            fi

            if [ ! -f "docker-compose.yml" ] && \
               [ ! -f "docker-compose.yaml" ] && \
               [ ! -f "compose.yml" ] && \
               [ ! -f "compose.yaml" ]; then
              echo "No Docker Compose file found in $DEPLOY_PATH"
              exit 1
            fi

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            chmod 600 .env.production

            docker compose \
              --env-file .env.production \
              config --quiet

            docker compose \
              --env-file .env.production \
              build hr-frontend

            docker compose \
              --env-file .env.production \
              up -d \
              --no-deps \
              hr-frontend

            docker compose \
              --env-file .env.production \
              ps hr-frontend

            docker image prune -f

            echo "Frontend deployment completed successfully."
