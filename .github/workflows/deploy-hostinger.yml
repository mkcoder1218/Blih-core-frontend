name: Deploy HR Frontend

on:
  push:
    branches:
      - integration
      - master
  workflow_dispatch:

concurrency:
  group: hr-frontend-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd

          echo "Root files:"
          ls -la

          if [ ! -f package.json ]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json was not found in the repository root."
            echo "::error::Generate it with npm install, then commit and push it."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Trigger VPS deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.HOSTINGER_FRONTEND_DEPLOY_PATH }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "HOSTINGER_FRONTEND_DEPLOY_PATH is empty."
              exit 1
            fi

            if [ ! -d "$DEPLOY_pPATH" ]; then
              echo "Deployment directory does not exist: $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f deploy.sh ]; then
              echo "deploy.sh was not found in: $DEPLOY_PATH"
              exit 1
            fi

            chmod +x deploy.sh
            ./deploy.sh
